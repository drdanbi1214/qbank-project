<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="달렌의 서재" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      본문 기본 함초롬체, 선택 가능한 함초롬바탕·IBM Plex Sans KR, 서비스 이름 Jua.
      함초롬체·함초롬바탕은 font-display: swap으로 본문 표시를 막지 않고,
      IBM Plex Sans KR와 Jua는 필요한 글자 조각만 받는 Google Fonts를 쓴다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Jua&display=swap"
      rel="stylesheet"
    />
    <title>달렌의 서재</title>
    <script>
      // FOUC 방지: 앱이 프로필 테마를 받아오기 전 마지막 적용 테마를 먼저 반영한다.
      try {
        var cached = localStorage.getItem('qbank.theme.cache')
        var cachedFontFamily = localStorage.getItem('qbank.font-family.cache')
        document.documentElement.dataset.fontFamily =
          cachedFontFamily === 'hamchorom-batang' || cachedFontFamily === 'ibm-plex-sans'
            ? cachedFontFamily
            : 'hamchorom'
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (cached === 'dark' || ((!cached || cached === 'system') && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
